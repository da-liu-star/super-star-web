name: Deploy Docker Stack To Aliyun

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: super-star-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate frontend
        run: |
          npm test
          npm run build

      - name: Build and deploy Docker stack
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: ${{ secrets.ALIYUN_PORT }}
          command_timeout: 40m
          script_stop: true
          script: |
            set -euo pipefail

            APP_ROOT=/opt/super-star
            FRONTEND_DIR="$APP_ROOT/frontend"
            BACKEND_DIR="$APP_ROOT/backend"
            FRONTEND_REPO=https://github.com/da-liu-star/super-star-web.git
            BACKEND_REPO=https://github.com/da-liu-star/super-star.git

            mkdir -p "$APP_ROOT"

            update_repo() {
              local directory="$1"
              local repository="$2"

              if [ ! -d "$directory/.git" ]; then
                git clone --branch main "$repository" "$directory"
                return
              fi

              git -C "$directory" fetch origin main --prune
              git -C "$directory" checkout main
              git -C "$directory" pull --ff-only origin main
            }

            update_repo "$FRONTEND_DIR" "$FRONTEND_REPO"
            update_repo "$BACKEND_DIR" "$BACKEND_REPO"

            if [ ! -f "$APP_ROOT/.env" ]; then
              echo "Missing $APP_ROOT/.env"
              exit 1
            fi

            if docker info >/dev/null 2>&1; then
              DOCKER=(docker)
            else
              DOCKER=(sudo -n docker)
            fi

            cd "$FRONTEND_DIR/deploy"
            "${DOCKER[@]}" compose --env-file "$APP_ROOT/.env" config >/dev/null
            "${DOCKER[@]}" compose --env-file "$APP_ROOT/.env" up -d --build --remove-orphans
            "${DOCKER[@]}" compose --env-file "$APP_ROOT/.env" ps
