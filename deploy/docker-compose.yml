name: super-star

services:
  user:
    build:
      context: ${BACKEND_ROOT:?Set BACKEND_ROOT in /opt/super-star/.env}
      dockerfile: Dockerfile
      args:
        MODULE: user
    restart: unless-stopped
    networks:
      - default
      - mysql-net
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_USERNAME: ${MYSQL_USER:?Set MYSQL_USER in /opt/super-star/.env}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in /opt/super-star/.env}
      DB_URL: jdbc:mysql://${MYSQL_HOST:?Set MYSQL_HOST in /opt/super-star/.env}:${MYSQL_PORT:-3306}/super_star_user?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      OAUTH_JWK_SET_URI: http://oauth:9000/oauth2/jwks
      USER_INTERNAL_TOKEN: ${USER_INTERNAL_TOKEN:?Set USER_INTERNAL_TOKEN in /opt/super-star/.env}

  oauth:
    build:
      context: ${BACKEND_ROOT:?Set BACKEND_ROOT in /opt/super-star/.env}
      dockerfile: Dockerfile
      args:
        MODULE: oauth
    restart: unless-stopped
    networks:
      - default
      - mysql-net
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_USERNAME: ${MYSQL_USER:?Set MYSQL_USER in /opt/super-star/.env}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in /opt/super-star/.env}
      DB_URL: jdbc:mysql://${MYSQL_HOST:?Set MYSQL_HOST in /opt/super-star/.env}:${MYSQL_PORT:-3306}/super_star_oauth?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      USER_SERVICE_BASE_URL: http://user:9001
      USER_INTERNAL_TOKEN: ${USER_INTERNAL_TOKEN:?Set USER_INTERNAL_TOKEN in /opt/super-star/.env}
    depends_on:
      user:
        condition: service_started

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      OAUTH_UPSTREAM: http://oauth:9000
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      oauth:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  mysql-net:
    external: true
    name: ${MYSQL_NETWORK:-super-star-net}
